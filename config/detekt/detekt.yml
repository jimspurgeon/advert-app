build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    active: false   # data classes & builders common in domain layer

style:
  MagicNumber:
    active: false   # scheduler constants are documented in-code w/ research refs
  ReturnCount:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

exceptions:
  TooGenericExceptionCaught:
    active: false   # channel implementations catch broadly by design
