# Retarget Gradle properties

# Build throughput
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is the only option; AGP 9 defaults this anyway — pinned for clarity.
android.useAndroidX=true

# Built-in Kotlin (AGP 9): compiler emits final executable bytecode without needing OpenJDK javac bridging.
kotlin.code.style=official
